image: ubuntu:jammy

build-pages:
  pages:
    publish: public
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
      - .venv
  script:
  - apt update -y
  - DEBIAN_FRONTEND=noninteractive apt install -y python3.10 pipx python-is-python3 python3-venv git pandoc
  - git submodule init
  - git submodule update --remote --merge
  - python3 -m venv .venv
  - source .venv/bin/activate
  - pip install --upgrade pip
  - apt install -y libnetcdf-dev
  - pip install sphinx sphinxcontrib-bibtex sphinxcontrib-htmlhelp sphinxcontrib-mermaid sphinxcontrib-programoutput sphinx-rtd-theme linkify-it-py
  - pip install ipython myst_parser nbsphinx pandoc
  - pip install xarray cartopy netCDF4 nc-time-axis psutil jinja2 dask pickleshare
  - pip install . 
  - sphinx-build -b html doc/ public  
  artifacts:
    paths:
    - public
